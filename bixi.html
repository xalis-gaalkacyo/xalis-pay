<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XALIS — Checkout</title>
<style>
 *{box-sizing:border-box}
 html,body{height:100%}
 body{margin:0;height:100dvh;overflow:hidden;background:#0a1f14;color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;justify-content:center}
 .wrap{max-width:430px;width:100%;height:100%;display:flex;flex-direction:column;padding:0 14px}
 .status{border-radius:0 0 16px 16px;padding:12px 10px;text-align:center;font-weight:800;font-size:20px;letter-spacing:1px}
 .status small{display:block;font-weight:600;font-size:13px;opacity:.9;margin-top:2px;letter-spacing:0}
 .st-ready{background:rgba(255,255,255,.07);color:#e5e7eb}
 .st-wait{background:#8f1d22;color:#fff;animation:pulse 1.6s infinite}
 .st-paid{background:#16a34a;color:#fff}
 @keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}
 .body{flex:1;display:flex;flex-direction:column;gap:19px;padding:20px 0 12px;min-height:0}
 .prod{display:flex;gap:14px;align-items:center;background:#10281a;border:1px solid #1d3a28;border-radius:16px;padding:12px}
 .prod img{width:94px;height:94px;object-fit:cover;border-radius:12px;cursor:zoom-in;flex:none}
 .prod .nm{font-size:18px;font-weight:700;line-height:1.25}
 .oid{display:inline-block;background:#14532d;color:#7ee2a8;border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700;margin-top:6px}
 .amount{text-align:center}
 .amount .alb{color:#9db8a8;font-size:13.5px}
 .amount .vl{font-size:46px;font-weight:800;line-height:1.05}
 .methods{display:flex;gap:10px}
 .m{flex:1;text-align:center;padding:13px 2px;border-radius:12px;background:#12291b;border:1.5px solid #234433;color:#cfe3d6;font-weight:700;font-size:15px;cursor:pointer;user-select:none}
 .m small{display:block;font-weight:400;font-size:11px;color:#7d968a;margin-top:2px}
 .m.on{background:#1faa4e;border-color:#1faa4e;color:#fff}
 .m.on small{color:#d9f5e3}
 .m.off{opacity:.45;cursor:default}
 .pay{display:block;text-decoration:none;background:#1faa4e;border-radius:16px;padding:17px 12px 15px;text-align:center;color:#fff;cursor:pointer}
 .pay:active{transform:scale(.99)}
 .pay .l1{font-size:24px;font-weight:800;letter-spacing:.3px}
 .pay .l2{font-size:18px;font-weight:700;margin-top:2px}
 .pay .l3{font-size:15px;font-family:Consolas,monospace;opacity:.85;margin-top:4px;letter-spacing:.5px}
 .pay .l3{margin-top:6px}
 .ussdrow{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
 .ussdrow .code{font-size:15px;font-family:Consolas,monospace;opacity:.85;letter-spacing:.5px}
 .copybtn{background:#fff;color:#128c3e;border:none;border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;flex:none}
 .copybtn:active{transform:scale(.95)}
 .tix label{font-size:15.5px;font-weight:600;display:block;margin-bottom:8px}
 .trow{display:flex;gap:9px}
 input{flex:1;background:#0e2417;border:1.5px solid #27513a;border-radius:12px;color:#fff;font-size:16.5px;padding:12px 13px;min-width:0}
 input:focus{outline:2px solid #1faa4e}
 .sbtn{background:#f5b921;color:#231a00;font-weight:800;font-size:16.5px;border:none;border-radius:12px;padding:0 24px;cursor:pointer}
 .sbtn:active{transform:scale(.97)}
 .msg{font-size:13.5px;margin-top:8px;min-height:17px;text-align:center}
 .foot{margin-top:auto;text-align:center;color:#5f7a6a;font-size:12px}
 .err{padding:26px;font-size:16px;text-align:center;margin:auto}
 .lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
 .lb img{max-width:94vw;max-height:88dvh;border-radius:14px}
 .lb .x{position:absolute;top:14px;right:20px;color:#fff;font-size:34px;font-weight:300;line-height:1}
 @media (max-height:720px){
   .amount .vl{font-size:38px}
   .prod img{width:74px;height:74px}
   .pay .l1{font-size:21px}
   .body{gap:12px;padding-top:12px}
 }
</style>
</head>
<body>
<div class="wrap" id="box" style="display:none">
 <div class="status st-ready" id="status">Dalabkaagu waa diyaar<small>Bixi, kadibna Tixraaca geli si laguu xaqiijiyo</small></div>
 <div class="body">
  <div class="prod">
   <img id="img" alt="" style="display:none">
   <div><div class="nm" id="name"></div><span class="oid" id="oid" style="display:none"></span></div>
  </div>

  <div class="amount"><div class="alb">Wadarta</div><div class="vl">$<span id="tot"></span></div></div>

  <div class="methods" id="methods">
   <div class="m on" data-m="SAHAL">SAHAL</div>
   <div class="m" data-m="EVC">EVC</div>
   <div class="m" data-m="eDahab">eDahab</div>
   <div class="m off">SAAD<small>dhowaan</small></div>
  </div>

  <div class="pay" id="btn">
   <div class="l1" id="pl1"></div>
   <div class="l2" id="pl2"></div>
   <div class="ussdrow"><span class="code" id="pl3"></span><button class="copybtn" id="copybtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span id="copytxt">Copy</span></button></div>
  </div>

  <div class="tix" id="tixsec" style="display:none">
   <label>Tixraaca lacagta aad bixisay geli:</label>
   <div class="trow">
    <input id="tix" inputmode="numeric" autocomplete="off" placeholder="Tixraac: 7574461671">
    <button class="sbtn" id="send">Dir</button>
   </div>
   <div class="msg" id="msg"></div>
  </div>

  <div class="foot">XALIS — Gaalkacyo</div>
 </div>
</div>
<div class="err" id="err" style="display:none">Link-gu waa khaldan yahay.</div>
<div class="lb" id="lb"><span class="x">&times;</span><img id="lbimg" alt=""></div>

<script>
 var API = 'https://script.google.com/macros/s/AKfycbxBDKTBZsWt5GNR563Q6SgLSojsiCUYsIN_Lh0G1ZbPgp3Lx1EF1mszvR6DcaUI9zU0bg/exec';
 var TOKEN = 'xalis-store-7741';
 var METHODS = {
   'SAHAL':  { num: '7643549',   pre: '*883*' },
   'EVC':    { num: '613291310', pre: '*712*' },
   'eDahab': { num: '667643549', pre: '*110*' }
 };
 var curMethod = 'SAHAL';
 var q = new URLSearchParams(location.search);
 var amt = (q.get('bixi') || '').replace(/[^0-9.]/g, '');
 var dalab = (q.get('dalab') || '').trim();
 var poller = null;
 var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

 function ussd(m) { return METHODS[m].pre + METHODS[m].num + '*' + amt + '#'; }
 var intentUrl = '';
 function renderMethod() {
   document.getElementById('pl1').textContent = curMethod + ' · ' + METHODS[curMethod].num;
   document.getElementById('pl2').textContent = 'Bixi $' + amt;
   document.getElementById('pl3').textContent = ussd(curMethod);
   intentUrl = isIOS ? '' : 'intent:' + ussd(curMethod).replace('#', '%23') + '#Intent;scheme=tel;action=android.intent.action.DIAL;end';
   var ms = document.querySelectorAll('#methods .m[data-m]');
   for (var i = 0; i < ms.length; i++) ms[i].classList.toggle('on', ms[i].getAttribute('data-m') === curMethod);
 }
 function doCopy(txt) {
   function done() {
     var ct = document.getElementById('copytxt');
     ct.textContent = 'Waa la koobiyeeyay';
     setTimeout(function(){ ct.textContent = 'Copy'; }, 2000);
   }
   if (navigator.clipboard && navigator.clipboard.writeText) {
     navigator.clipboard.writeText(txt).then(done).catch(function(){ fallback(); });
   } else { fallback(); }
   function fallback() {
     var ta = document.createElement('textarea');
     ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
     document.body.appendChild(ta); ta.select();
     try { document.execCommand('copy'); done(); } catch (e) {}
     document.body.removeChild(ta);
   }
 }
 function setStatus(kind, main, sub) {
   var s = document.getElementById('status');
   s.className = 'status ' + kind;
   s.innerHTML = main + (sub ? '<small>' + sub + '</small>' : '');
 }
 function api(params) {
   var u = API + '?token=' + TOKEN + '&' + params;
   return fetch(u).then(function(r){ return r.json(); });
 }
 function checkStatus() {
   if (!dalab) return;
   api('action=status&dalab=' + encodeURIComponent(dalab)).then(function(d) {
     if (!d || !d.ok) return;
     if (d.status === 'paid') {
       setStatus('st-paid', 'PAID ✓', 'Lacagta waa la xaqiijiyay — mahadsanid! Dalabkaaga waa la diyaarinayaa.');
       if (poller) { clearInterval(poller); poller = null; }
     } else if (d.status === 'waiting') {
       setStatus('st-wait', 'WAITING...', 'Sugaya xaqiijin — lacagtaada waa la hubinayaa');
       if (!poller) poller = setInterval(checkStatus, 8000);
     }
   }).catch(function(){});
 }

 if (!amt) { document.getElementById('err').style.display = 'block'; }
 else {
   if (amt.indexOf('.') >= 0) { amt = amt.replace(/0+$/, '').replace(/\.$/, ''); }
   var magac = q.get('magac') || 'Alaabta XALIS';
   var sawir = q.get('sawir') || '';
   document.getElementById('name').textContent = magac;
   document.getElementById('tot').textContent = amt;
   if (dalab) { var o = document.getElementById('oid'); o.textContent = 'Order: ' + dalab; o.style.display = 'inline-block'; }
   renderMethod();
   var ms = document.querySelectorAll('#methods .m[data-m]');
   for (var i = 0; i < ms.length; i++) {
     ms[i].addEventListener('click', function() { curMethod = this.getAttribute('data-m'); renderMethod(); });
   }
   document.getElementById('btn').addEventListener('click', function() { if (intentUrl) location.href = intentUrl; });
   document.getElementById('copybtn').addEventListener('click', function(e) { e.stopPropagation(); doCopy(ussd(curMethod)); });
   if (sawir) {
     var im = document.getElementById('img');
     im.src = sawir; im.style.display = 'block';
     im.onerror = function(){ im.style.display = 'none'; };
     var lb = document.getElementById('lb');
     document.getElementById('lbimg').src = sawir;
     im.addEventListener('click', function(){ lb.style.display = 'flex'; });
     lb.addEventListener('click', function(){ lb.style.display = 'none'; });
   }
   document.getElementById('box').style.display = 'block';

   if (dalab) {
     document.getElementById('tixsec').style.display = 'block';
     checkStatus();
     document.getElementById('send').addEventListener('click', function() {
       var tix = document.getElementById('tix').value.replace(/\D/g, '');
       var msg = document.getElementById('msg');
       if (tix.length < 6) { msg.textContent = 'Tixraacu waa gaaban yahay — SMS-ka ka fiiri.'; msg.style.color = '#fca5a5'; return; }
       msg.textContent = 'Waa la dirayaa...'; msg.style.color = '#e5e7eb';
       api('action=tixraac&dalab=' + encodeURIComponent(dalab) + '&tix=' + tix +
           '&wadarta=' + encodeURIComponent(amt) + '&magac=' + encodeURIComponent(magac) +
           '&hab=' + encodeURIComponent(curMethod))
       .then(function(d) {
         if (d && d.ok) {
           msg.textContent = 'Tixraaca waa la gudbiyay.'; msg.style.color = '#7ee2a0';
           setStatus('st-wait', 'WAITING...', 'Sugaya xaqiijin — lacagtaada waa la hubinayaa');
           if (!poller) poller = setInterval(checkStatus, 8000);
           checkStatus();
         } else { msg.textContent = 'Diristu way fashilantay — mar kale isku day.'; msg.style.color = '#fca5a5'; }
       }).catch(function(){ msg.textContent = 'Diristu way fashilantay — mar kale isku day.'; msg.style.color = '#fca5a5'; });
     });
   }
 }
</script>
</body>
</html>
